name: seats
on:
  pull_request:
permissions:
  contents: read
jobs:
  seat-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: User systemd session (the plain install's service)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: A seated sidekick against a real skgateway with client auth
        run: bash tests/e2e/test_seat_gateway.sh
